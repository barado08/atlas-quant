name: ATLAS QUANT — tests, real data and historical baselines
on:
  push:
    paths-ignore:
      - 'reports/**'
      - 'paper/**'
      - 'monitor/**'
  workflow_dispatch:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m compileall -q app.py trading_ai scripts
  real-market-backtests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - name: Fetch REAL crypto, ETF and FX candles (no simulated fallback)
        run: python scripts/online_smoke.py
      - name: Fixed-strategy, out-of-sample backtests on REAL historical prices
        run: python scripts/real_backtests.py
      - name: Comprehensive market, strategy and cost-stress audit
        run: python scripts/full_backtest_audit.py
      - name: Save audit JSON (even on a failed fetch)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-quant-real-backtest-report
          path: |
            reports/baseline_real_oos.json
            reports/full_backtest_audit.json
            reports/full_backtest_rows.csv
          if-no-files-found: warn
