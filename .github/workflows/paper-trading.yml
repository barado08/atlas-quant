name: ATLAS QUANT — Forward paper trading (no real money)
on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'
permissions:
  contents: write
concurrency:
  group: atlas-paper-ledger
  cancel-in-progress: false
jobs:
  forward-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify tests first
        run: python -m pytest -q
      - name: Forward-only paper ledger from completed daily bars
        run: python scripts/paper_tracker.py
      - name: Archive state and review summary, even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-forward-paper-ledger
          path: |
            paper/state.json
            paper/status.json
          retention-days: 90
          if-no-files-found: warn
      - name: Persist paper ledger to GitHub (never place real orders)
        if: success()
        run: |
          git config user.name "atlas-quant-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f paper/state.json paper/status.json || true
          if ! git diff --cached --quiet; then
            git commit -m "data: update forward paper ledger [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
