name: ATLAS QUANT — Autonomous multi-market strategy discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '25 5 * * *'
permissions:
  contents: write
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: atlas-strategy-discovery
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Check unit tests before scanning
        run: python -m pytest -q
      - name: Rebuild complete supported worldwide catalog daily with real histories
        env:
          MAX_ASSETS: '400'
        run: python scripts/strategy_discovery.py --universe global --max-assets "$MAX_ASSETS"
      - name: Enroll qualified research candidates into forward-only paper trading
        run: python scripts/paper_tracker.py
      - name: Persist latest research report and forward paper state
        if: success()
        run: |
          git config user.name "atlas-quant-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/discovery_latest.json reports/discovery_latest.csv paper/state.json paper/status.json
          if ! git diff --cached --quiet; then
            git commit -m "data: persist daily discovery report [skip ci]"
            for attempt in 1 2 3; do
              if ! git pull --rebase origin main; then
                git rebase --abort || true
                echo "REBASE_CONFLICT: results remain available as artifact" >&2
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "DISCOVERY_PERSISTED"
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "PERSIST_FAILED: results remain available as artifact" >&2
                exit 1
              fi
              sleep $((attempt * 3))
            done
          fi
      - name: Archive full JSON and readable CSV, even on failed or partial scans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-daily-strategy-discovery
          path: |
            reports/discovery_latest.json
            reports/discovery_latest.csv
          retention-days: 90
          if-no-files-found: warn
