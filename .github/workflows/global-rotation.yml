name: ATLAS QUANT — Global research rotation 5m
on:
  push:
    paths:
      - '.github/workflows/global-rotation.yml'
      - 'scripts/rotate_discovery.py'
      - 'scripts/global_universe.py'
  workflow_dispatch:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
permissions:
  contents: write
concurrency:
  group: atlas-global-rotation
  cancel-in-progress: false
jobs:
  rotate-global-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install quant dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate scanner on source changes
        if: github.event_name != 'schedule'
        run: python -m pytest -q
      - name: Backtest next geographically diversified shard
        run: python scripts/rotate_discovery.py --shards 12
      - name: Archive current scan, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-world-shard-${{ github.run_id }}
          path: reports/shards/*
          if-no-files-found: warn
          retention-days: 3
      - name: Persist shard results safely even when another run updates the same slot
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "atlas-quant-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Save this run's generated report outside the checkout BEFORE updating main.
          mapfile -t changed < <(git status --porcelain=v1 -uall -- reports/shards | cut -c4-)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "NO_CHANGES_TO_PERSIST"
            exit 0
          fi
          backup="$(mktemp -d)"
          for file in "${changed[@]}"; do
            mkdir -p "$backup/$(dirname "$file")"
            cp "$file" "$backup/$file"
          done

          for attempt in 1 2 3 4; do
            # Fresh checkout prevents add/add merge conflicts against competing runs.
            git fetch origin main
            git reset --hard origin/main
            for file in "${changed[@]}"; do
              mkdir -p "$(dirname "$file")"
              cp "$backup/$file" "$file"
            done

            # If another run has produced newer results for the SAME slot, keep those.
            python - "$backup" <<'PY'
          import json, pathlib, sys, datetime
          old=pathlib.Path(sys.argv[1])
          for candidate in old.glob('reports/shards/slot_*.json'):
              destination=pathlib.Path('reports/shards')/candidate.name
              if not destination.exists():
                  continue
              try:
                  current=json.loads(destination.read_text())
                  new=json.loads(candidate.read_text())
                  if (current.get('date_utc') or '') > (new.get('date_utc') or ''):
                      print('KEEP_NEWER_SHARD',destination.name)
                      # Restore original latest report; do not regress to old data
                      candidate.write_text(destination.read_text())
                      csv_file=candidate.with_suffix('.csv')
                      current_csv=destination.with_suffix('.csv')
                      if current_csv.exists():
                          csv_file.write_text(current_csv.read_text())
              except (OSError,ValueError):
                  pass
          PY
            for file in "${changed[@]}"; do
              cp "$backup/$file" "$file"
            done
            git add -f -- "${changed[@]}"
            if git diff --cached --quiet; then
              echo "LATEST_SHARD_ALREADY_PRESENT"
              exit 0
            fi
            git commit -m "data: global rotating research shard [skip ci]"
            if git push origin HEAD:main; then
              echo "WORLD_RESEARCH_PERSISTED on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "PERSIST_FAILED: report still available as Actions artifact" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
